<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rizky FM — Tune Into My World</title>

  <style>
    /* =========================
       RESET
    ========================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050611;
      color: white;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    /* =========================
       BACKGROUND
    ========================= */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;

      background:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
        radial-gradient(circle at 20% 15%, rgba(145,70,255,0.22), transparent 30%),
        radial-gradient(circle at 85% 30%, rgba(0,180,255,0.15), transparent 28%),
        radial-gradient(circle at 50% 90%, rgba(255,50,180,0.12), transparent 30%);

      background-size:
        70px 70px,
        70px 70px,
        auto,
        auto,
        auto;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        180deg,
        transparent,
        rgba(5,6,17,0.35) 50%,
        #050611 100%
      );
      pointer-events: none;
    }

    /* =========================
       INTRO
    ========================= */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at center, rgba(130,70,255,0.18), transparent 35%),
        #050611;

      transition: 0.7s ease;
    }

    #intro.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-content {
      width: min(90%, 600px);
      text-align: center;
    }

    .intro-frequency {
      color: #a88cff;
      font-size: 14px;
      letter-spacing: 5px;
      margin-bottom: 20px;
    }

    .intro-title {
      font-size: clamp(48px, 12vw, 100px);
      font-weight: 900;
      letter-spacing: -5px;

      background: linear-gradient(
        90deg,
        #a66cff,
        #4ddcff,
        #ff66c4
      );

      -webkit-background-clip: text;
      color: transparent;
    }

    .intro-subtitle {
      color: #aaaec5;
      margin-top: 10px;
      font-size: 15px;
    }

    #enter {
      margin-top: 35px;
      padding: 14px 30px;

      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px;

      background: rgba(255,255,255,0.07);
      color: white;

      cursor: pointer;
      transition: 0.3s;
    }

    #enter:hover {
      background: white;
      color: #080812;
      transform: translateY(-3px);
    }

    /* =========================
       NAVBAR
    ========================= */
    header {
      position: sticky;
      top: 0;
      z-index: 100;

      backdrop-filter: blur(18px);
      background: rgba(5,6,17,0.75);

      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
